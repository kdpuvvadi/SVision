    <h1>Socket test tool</h1>
    <p>The TCP socket result viewer is a desktop window started by <code>run.bat</code> (<code>python -m app.socket_test_ui</code>).</p>
    <ol>
      <li>In SVision Settings, enable <strong>TCP Socket</strong> and Save.</li>
      <li>Connect the viewer to <code>127.0.0.1:9100</code> (default).</li>
      <li>Run Measure or click <strong>Trigger</strong> in the viewer.</li>
